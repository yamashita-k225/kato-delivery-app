<style>
/* Layout: 1列のスマホ向けチェックリスト。上に進捗、下に停車順のカード。次の1件だけ開いて見せる。
   Color: 寒色グレーの地、青=操作、橙=いま向かう先、緑=完了、黄=注意事項、赤=時間超過 */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --fg:#14212B; --muted:#586977; --line:#D8E0E7;
  --accent:#0B5FA5; --accent-fg:#FFFFFF; --signal:#C2410C; --signal-bg:#FFF1E8;
  --ok:#23704A; --ok-bg:#E6F4EC; --bad:#B42318; --bad-bg:#FDECEA;
  --warn:#7A4E00; --warn-bg:#FFF4D6;
  --font:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#17222B; --fg:#E8EEF2; --muted:#93A3B0; --line:#2A3946;
  --accent:#5AA9E6; --accent-fg:#06121B; --signal:#FFA066; --signal-bg:#2B1D14;
  --ok:#5CC48A; --ok-bg:#12261C; --bad:#FF8A80; --bad-bg:#2D1715;
  --warn:#F2C35B; --warn-bg:#2A2310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17222B; --fg:#E8EEF2; --muted:#93A3B0; --line:#2A3946;
  --accent:#5AA9E6; --accent-fg:#06121B; --signal:#FFA066; --signal-bg:#2B1D14;
  --ok:#5CC48A; --ok-bg:#12261C; --bad:#FF8A80; --bad-bg:#2D1715;
  --warn:#F2C35B; --warn-bg:#2A2310; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,a{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:20px;font-weight:900;margin:0;letter-spacing:.02em}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.counts{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--fg)}

.next{margin:14px 0 4px;padding:12px 14px;border-radius:10px;background:var(--signal-bg);color:var(--signal);font-weight:700;display:flex;gap:10px;align-items:center}
.next small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.next.finished{background:var(--ok-bg);color:var(--ok)}

ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.start,.goal{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}
.start b,.goal b{color:var(--fg)}
.goal{flex-wrap:wrap}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stop.active{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.stop.done{background:var(--bg)}
.head{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:none;border:0;color:inherit;padding:12px 14px;min-height:56px;cursor:pointer}

  background:var(--line);color:var(--fg);font-variant-numeric:tabular-nums}
.active .badge{background:var(--signal);color:var(--surface)}

.name{font-weight:700;line-height:1.35;overflow-wrap:anywhere}

.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;text-align:right}

.body{padding:0 14px 14px;border-top:1px solid var(--line)}

.items{display:flex;flex-direction:column;gap:12px;margin:0 0 12px}

.item .t{font-weight:500;overflow-wrap:anywhere}

.warn{font-size:13px;line-height:1.6;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);overflow-wrap:anywhere}
.warn b{display:inline-block;margin-right:8px;font-size:11px;letter-spacing:.1em}

.btn.set{background:var(--ok-bg);color:var(--ok);border-color:transparent}

.foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.reset{min-height:44px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer}
.reset.arm{background:var(--bad-bg);color:var(--bad);border-color:transparent}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
@media (max-width:360px){.acts{grid-template-columns:1fr}}
</style>

var KEY = 'kato-course-v1';
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY)); if(s && s.day===today()){ if(!s.how) s.how={}; return s; }}catch(e){}
  return {day:today(),done:{},arr:{},open:null,how:{}};
}
var state = load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

var TOTAL = 0; STOPS.forEach(function(s){TOTAL += s.items.length;});
function stopDone(s){return s.items.every(function(i){return state.done[i.no];});}
function activeIdx(){for(var i=0;i<STOPS.length;i++){if(!stopDone(STOPS[i])) return i;} return -1;}
function pad(n){return n<10?'0'+n:''+n;}
function hhmm(d){return d.getHours()+':'+pad(d.getMinutes());}
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function navUrl(addr){return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(addr);}
function $(id){return document.getElementById(id);}

function render(){
  var a = activeIdx();
  var doneCount = 0; STOPS.forEach(function(s){s.items.forEach(function(i){if(state.done[i.no]) doneCount++;});});
  $('cDone').textContent = doneCount;
  $('cLeft').textContent = TOTAL - doneCount;
  $('barfill').style.width = (doneCount/TOTAL*100)+'%';
  $('bar').setAttribute('aria-valuenow', doneCount);

  var nx = $('next');
  if(a<0){
    nx.innerHTML = '<div class="next finished"><div>全件完了です<small>茅ヶ崎へ戻りましょう</small></div></div>';
  }else{
    var s0 = STOPS[a];
    nx.innerHTML = '<div class="next"><div>次は '+s0.name+'<small>予定 '+s0.plan+' ・ 残り '+s0.items.filter(function(i){return !state.done[i.no];}).length+'件</small></div></div>';
  }

  var html = '<li class="start"><b>6:00</b><span>茅ヶ崎を出発（カポの申請書・シンガポールの入館証を持つ）</span></li>';
  STOPS.forEach(function(s,idx){
    var done = stopDone(s), isActive = idx===a;
    var open = state.open===s.id || (state.open==null && isActive);
    var left = s.items.filter(function(i){return !state.done[i.no];}).length;
    var cls = 'stop'+(done?' done':'')+(isActive?' active':'');
    html += '<li class="'+cls+'">';
    html += '<button class="head" type="button" data-act="open" data-id="'+s.id+'" aria-expanded="'+open+'">'
         + '<span class="badge">'+(done?'✓':s.id)+'</span>'
         + '<span><span class="name">'+s.name+'</span><span class="meta" style="display:block">'
         + (done ? '完了' : '残り'+left+'/'+s.items.length+'件')
         + (state.arr[s.id] ? ' ・ 到着 '+state.arr[s.id] : '')+'</span></span>'
         + '<span class="plan">'+s.plan+'<small>予定</small></span></button>';
    if(open){
      html += '<div class="body"><p class="addr">'+s.addr+'</p>';
      var chips = '';
      s.tags.forEach(function(t){chips += '<span class="chip time">'+t+'</span>';});
      if(s.limit && !done && nowMin()>mins(s.limit)) chips += '<span class="chip late">時間を過ぎています</span>';
      if(chips) html += '<div class="chips">'+chips+'</div>';
      html += '<div class="items">';
      s.items.forEach(function(i){
        var on = !!state.done[i.no];
        html += '<div class="irow">'
              + '<button class="item" type="button" data-act="item" data-no="'+i.no+'" data-id="'+s.id+'" aria-pressed="'+on+'">'
              + '<span class="box">✓</span><span class="t">'+i.n+'<span><em>No.'+i.no+'</em>'+(i.f?' ・ '+i.f:'')+(i.memo?' ・ '+i.memo:'')+'</span></span></button>';
        if(i.warn) html += '<div class="warn"><b>注意事項</b>'+i.warn+'</div>';
        if(i.how) html += '<div class="howtext"><b class="howlabel">集配方法</b>'+i.how+'</div>';
        html += '</div>';
      });
      html += '</div><div class="acts">'
            + '<a class="btn primary" href="'+navUrl(s.addr)+'" target="_blank" rel="noopener">ナビを開く</a>'
            + '<button class="btn'+(state.arr[s.id]?' set':'')+'" type="button" data-act="arrive" data-id="'+s.id+'">'
            + (state.arr[s.id] ? '到着 '+state.arr[s.id]+'（取消）' : '到着を記録')+'</button></div></div>';
    }
    html += '</li>';
  });
  html += '<li class="goal"><b>茅ヶ崎へ戻る</b><span style="flex:1;min-width:0">予定 15:30 発 ・ 17:00ごろ着</span>'
        + '<a class="btn primary" style="min-height:44px" href="'+navUrl(HOME_ADDR)+'" target="_blank" rel="noopener">ナビを開く</a></li>';
  $('list').innerHTML = html;
}

function tick(){ $('clock').textContent = hhmm(new Date()); }

$('list').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  var act = el.getAttribute('data-act'), id = +el.getAttribute('data-id');
  var before = activeIdx();
  if(act==='open'){
    var a = activeIdx(), isOpen = (state.open===id) || (state.open==null && a>=0 && STOPS[a].id===id);
    state.open = isOpen ? 'none' : id;
  }else if(act==='item'){
    var no = el.getAttribute('data-no');
    if(state.done[no]) delete state.done[no]; else state.done[no] = true;
    var s = STOPS.filter(function(x){return x.id===id;})[0];
    if(stopDone(s)){
      if(!state.arr[id]) state.arr[id] = hhmm(new Date());
      state.open = null;
    }
  }else if(act==='how'){
    var hn = el.getAttribute('data-no');
    if(state.how[hn]) delete state.how[hn]; else state.how[hn] = true;
  }else if(act==='arrive'){
    if(state.arr[id]) delete state.arr[id]; else state.arr[id] = hhmm(new Date());
  }
  save(); render();
  var after = activeIdx();
  if(after!==before && after>=0){
    var cards = document.querySelectorAll('.stop');
    if(cards[after] && cards[after].scrollIntoView) cards[after].scrollIntoView({block:'start',behavior:'smooth'});
  }
});

var armed = false, armTimer = null;
$('reset').addEventListener('click', function(){
  var b = $('reset');
  if(!armed){
    armed = true; b.textContent = 'もう一度押すと全部消えます'; b.classList.add('arm');
    armTimer = setTimeout(function(){armed=false;b.textContent='リセット';b.classList.remove('arm');},4000);
  }else{
    clearTimeout(armTimer); armed=false; b.textContent='リセット'; b.classList.remove('arm');
    state = {day:today(),done:{},arr:{},open:null,how:{}}; save(); render();
  }
});

tick(); render();
setInterval(function(){tick(); render();}, 60000);
</script>

</body></html>
